<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>New Super Mario Bros Wii Sign-In Page</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
</head>
<body class="p-4">
    <div id="wrapper">
         <nav class="navbar navbar-expand sm bg-light justify-content-center">
         <ul class="navbar-nav">
    <li class="nav-item">
      <a class="nav-link" href="index.html">Home </a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="SignIn.html">Sign-In</a>
    </li>
    <li class="nav-item">
      <a class="nav-link" href="OnlineShopping.html">Shopping</a>
    </li>
    <li class="nav-item">
        <a class="nav-link" href="contact.html">Contact</a>
    </li>
  </ul>
        </nav>
        <br>
        <h1 class="title text-center">Enter Your Information in the form to get started</h1>
        <form action="sumbit.html" method="post">
            <div class="field-firstname">
                <label class="label">Your First Name</label>
                <div class="control">
                    <input class="input" type="text" placeholder="Enter your first name"
                    required>
                </div>
            </div>
            <div class="field-lastname">
                <div class="control">
                    <label class="label">Your Last Name</label>
                    <input class="input" type="text" placeholder="Enter your last name"
                    required>
                </div>
            </div>
            <div class="field-email">
                <div class="control">
                    <label class="label">Enter your email</label>
                    <input class="input" type="text" placeholder="Enter your email"
                    required>
                </div>
            </div>
            <h1 class="text-center">Tell us about your opinions</h1>
            <br>
            <p class="selection">Select your options below:</p>
            <br>

            <div class="select-options">
                <div class="select">
                    <select>
                        <option>What do you want to know about the game?</option>
                        <option>How to get better overtime</option>
                        <option>How to 100% complete the game</option>
                        <option>Learning the knowledge and skills</option>
                        <option>Speedrunning and achieving your goals/milestones</option>
                        <option>Keeping calm under pressure</option>
                    </select>
                </div>
            </div>
            <br>
            <br>
            <p class="title-selection">Who is your favourite Mario character?</p>
            <br>
                        <div class="field-checkbox">
                <div class="control">
                    <label class="checkbox">
                        <input type="checkbox">
                        Mario
                    </label>
                </div>
                <br>
            </div>
             <div class="field-checkbox">
                <div class="control">
                    <label class="checkbox">
                        <input type="checkbox">
                        Luigi
                    </label>
                </div>
                <br>
            </div>
             <div class="field-checkbox">
                <div class="control">
                    <label class="checkbox">
                        <input type="checkbox">
                        Princess Peach
                    </label>
                </div>
                <br>
            </div>
             <div class="field-checkbox">
                <div class="control">
                    <label class="checkbox">
                        <input type="checkbox">
                        Yoshi
                    </label>
                </div>
                <br>
            </div>
            <div class="field-checkbox">
                <div class="control">
                    <label class="checkbox">
                        <input type="checkbox">
                        Bowser
                    </label>
                </div>
                <br>
            </div>
            <div class="field-textarea">
                <div class="control">
                    <label class="label">Any questions, comments, or concerns?</label>
                    <textarea class="textarea" placeholder="Let us know your feedback about our team"></textarea>
                </div>
            </div>
            <div class="buttons">
                <div class="control">
                    <button class="button is-success" type="submit" id="btnsumbit">Submit feedback</button>
                    <button class="button is-warning" type="reset"  id="btnreset">Reset Feedback</button>
                    <button class="button is-danger" id="btnclose">Close</button>
                </div>
            </div>
        </form>
        <br>
    </div>
</body>
</html>
